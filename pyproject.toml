[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endstone-teleport-plugin"
version = "1.2.2"
description = "A teleport location management plugin for Endstone Bedrock servers"
requires-python = ">=3.10"
dependencies = ["endstone>=0.11.9,<0.12"]

[project.entry-points.endstone]
teleport-plugin = "endstone_teleport_plugin:TeleportPlugin"

[project.entry-points."endstone.commands"]
tptag = "endstone_teleport_plugin:TeleportPlugin"
tpreload = "endstone_teleport_plugin:TeleportPlugin"

[tool.hatch.build.targets.wheel]
packages = ["endstone_teleport_plugin"]
